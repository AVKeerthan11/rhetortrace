project:
  name: RhetorTrace
  mode: scripted

audio:
  sample_rate: 16000
  channels: 1

severity:
  min: 0
  max: 4

scoring:
  pacing: 0.25
  pitch: 0.25
  pauses: 0.20
  energy: 0.15
  clarity: 0.15

detection:
  z_open: 2.0
  z_close: 1.0
  min_consecutive_words: 3
  merge_gap_seconds: 0.5
  boundary_refinement_ms: 150

reproducibility:
  seed: 1337

alignment:
  asr_model: small          # Whisper model, used only for the ASR quality check
  align_model: null         # null = WhisperX default wav2vec2 model for the language
  language: en
  device: cpu
  compute_type: int8
  batch_size: 8
  asr_qc: true
  dataset_dir: dataset
  output_dir: results/alignments
  qc:
    min_aligned_ratio: 0.95     # below -> fail
    low_score_threshold: 0.3    # per-word wav2vec2 char-probability mean
    max_low_score_ratio: 0.15   # above -> warn
    min_word_duration: 0.03     # seconds; one wav2vec2 frame = 0.02
    max_word_duration: 2.0      # seconds
    max_asr_wer: 0.20           # above -> warn (take may deviate from script)

features:
  output_dir: results/features
  pitch:
    time_step: 0.01             # s between F0 frames
    floor_hz: 75
    ceiling_hz: 500
    voicing_threshold: 0.45     # Praat autocorrelation defaults
    silence_threshold: 0.03
    octave_cost: 0.01
    octave_jump_cost: 0.35
    voiced_unvoiced_cost: 0.14
    min_voiced_frames: 3        # per word; fewer -> pitch stats are null
    range_percentiles: [10, 90] # F0 range = p90 - p10 in semitones
    energy_gate: true           # suppress F0 in frames near the noise floor (background hum)
    gate_window: 0.04           # s, RMS window per F0 frame
    noise_floor_percentile: 10  # of frame energies in the take
    gate_margin_db: 6           # keep F0 only above floor + margin
  energy:
    time_step: 0.01             # s between frames
    window: 0.025               # s, RMS window
    noise_floor_percentile: 10  # of frame energies in the take
    active_margin_db: 6         # frame is audible above floor + margin
    peak_percentile: 95         # robust per-word peak
  rate:                         # unit: words/second (no offline syllable dictionary)
    window_words: 5             # centred local window, clipped to the sentence
    min_window_words: 3         # fewer aligned words -> local rate is null
    sentence_end: ".?!"         # region boundaries
