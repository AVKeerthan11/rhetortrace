project:
  name: RhetorTrace
  mode: scripted

audio:
  sample_rate: 16000
  channels: 1

severity:
  min: 0
  max: 4

scoring:
  pacing: 0.25
  pitch: 0.25
  pauses: 0.20
  energy: 0.15
  clarity: 0.15

detection:
  z_open: 3.0                   # smoothed |robust z| that opens a candidate region (sweep: scripts/eval_detection.py --grid)
  z_close: 2.0                  # neighbours extend the region down to this |z|
  min_consecutive_words: 3      # default minimum region length (words)
  min_words: {pause: 1}         # per-category override: a pause is one boundary
  smooth_words: 3               # running median over each category track (single-word spikes are heavy-tailed)
  smooth_override: {pause: 1}   # pauses are single boundaries: not smoothed
  merge_gap_seconds: 0.5        # same-category/direction regions closer than this merge
  min_scale: {pause_after_s: 0.1}  # detection-side scale floors (s); gaps differ by tens of ms
  max_evidence: 5               # strongest feature deviations listed per region
  # safeguards (0 / false disables), justified by the leave-one-out controls
  duration_frame_s: 0.02        # alignment frame: ln-duration error ~ frame/duration, added to the scale
  pitch_directional: true       # pitch tracks split into flatter / livelier (monotone = flatter)
  min_clarity_active_frames: 0  # tested: 15 removed clarity on ~half the words for -1.5 pt FP; off
  min_alignment_score: 0.0      # tested: 0.6 cut FP 5 pt but lost pause recall (gaps of flawed speech); off
  monotone_min_ref_std_st: 0.75 # span pitch flattening only counts where the reference span varies at least this much (st)
  output_dir: results/detections
  boundary_refinement_ms: 150   # reserved for boundary refinement (not used yet)

reproducibility:
  seed: 1337

alignment:
  asr_model: small          # Whisper model, used only for the ASR quality check
  align_model: null         # null = WhisperX default wav2vec2 model for the language
  language: en
  device: cpu
  compute_type: int8
  batch_size: 8
  asr_qc: true
  dataset_dir: dataset
  output_dir: results/alignments
  qc:
    min_aligned_ratio: 0.95     # below -> fail
    low_score_threshold: 0.3    # per-word wav2vec2 char-probability mean
    max_low_score_ratio: 0.15   # above -> warn
    min_word_duration: 0.03     # seconds; one wav2vec2 frame = 0.02
    max_word_duration: 2.0      # seconds
    max_asr_wer: 0.20           # above -> warn (take may deviate from script)

features:
  output_dir: results/features
  pitch:
    time_step: 0.01             # s between F0 frames
    floor_hz: 75
    ceiling_hz: 500
    voicing_threshold: 0.45     # Praat autocorrelation defaults
    silence_threshold: 0.03
    octave_cost: 0.01
    octave_jump_cost: 0.35
    voiced_unvoiced_cost: 0.14
    min_voiced_frames: 3        # per word; fewer -> pitch stats are null
    range_percentiles: [10, 90] # F0 range = p90 - p10 in semitones
    energy_gate: true           # suppress F0 in frames near the noise floor (background hum)
    gate_window: 0.04           # s, RMS window per F0 frame
    noise_floor_percentile: 10  # of frame energies in the take
    gate_margin_db: 6           # keep F0 only above floor + margin
  energy:
    time_step: 0.01             # s between frames
    window: 0.025               # s, RMS window
    noise_floor_percentile: 10  # of frame energies in the take
    active_margin_db: 6         # frame is audible above floor + margin
    peak_percentile: 95         # robust per-word peak
  rate:                         # unit: words/second (no offline syllable dictionary)
    window_words: 5             # centred local window, clipped to the sentence
    min_window_words: 3         # fewer aligned words -> local rate is null
    sentence_end: ".?!"         # region boundaries
  pause:
    min_pause_s: 0.15           # inter-word gaps shorter than this are not pauses
    sentence_end: ".?!"         # sentence-boundary vs within-sentence pauses
  spectral:
    n_mfcc: 13
    n_mels: 40
    n_fft: 512                  # 32 ms FFT
    win_length: 0.025           # s
    hop: 0.01                   # s
    fmin: 0
    fmax: 8000
    rolloff_percent: 0.85
    noise_floor_percentile: 10  # only frames above floor + margin are aggregated
    active_margin_db: 6
    min_active_frames: 3        # per word / sentence; fewer -> null features
    sentence_end: ".?!"

baseline:
  reference_prefix: good_       # takes whose id starts with this are references
  min_refs: 2                   # fewer usable reference values -> no statistics
  prior_df: 2                   # weight of the feature's pooled MAD in each moderated scale (3 refs: per-word MAD is noisy)
  outlier_z: 3.5                # reference values beyond this robust z are listed as outliers
  pitch_span_words: 5           # centred window for span pitch variation (std of word median F0, sentence-clipped)
  pitch_span_min_words: 3       # fewer voiced words in the window -> no span value
  pitch_span_floor_st: 0.25     # std floor (pitch resolution) so a flat span cannot get flatter
  output_dir: results/baselines
